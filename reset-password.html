<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Harshii's Fleurify</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f7, #e7f0ff);
      color: #20233a;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 36px 30px;
      border-radius: 22px;
      box-shadow: 0 15px 50px #65408020;
    }
    .flower { font-size: 42px; text-align: center; }
    h1 { text-align: center; font-size: 27px; }
    p { color: #77748a; line-height: 1.5; text-align: center; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfcce9;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 30px;
      background: #df3894;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { white-space: pre-wrap; font-size: 14px; }
    a { color: #c52c82; }
  </style>
</head>
<body>
  <main class="card">
    <div class="flower">🌸</div>
    <h1>Set a New Password</h1>
    <p>Harshii's Fleurify — Admin Account</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8"
             autocomplete="new-password" required
             placeholder="At least 8 characters">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8"
             autocomplete="new-password" required
             placeholder="Enter it again">

      <button id="submitButton" type="submit">UPDATE PASSWORD</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="/admin.html">Back to Admin Login</a></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://cfehtdlsranapckfdpig.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wJwYnSbJdODrkEqXqwr2fA_NhVnhDcB';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    let recoveryReady = false;

    async function checkRecoverySession() {
      message.textContent = 'Verifying reset link...';

      // Wait for Supabase to process the recovery link.
      const { data, error } = await supabaseClient.auth.getSession();

      if (error || !data.session) {
        recoveryReady = false;
        form.style.display = 'none';
        message.textContent =
          'Reset link invalid or expired. Please request a new password recovery email.';
        return;
      }

      recoveryReady = true;
      form.style.display = 'block';
      message.textContent = 'Reset link verified. Enter your new password.';
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        recoveryReady = true;
        form.style.display = 'block';
        message.textContent = 'Reset link verified. Enter your new password.';
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          'Reset link verify nahi hua. Email se mila latest reset link open karo.';
        return;
      }

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        message.textContent = 'Password at least 8 characters ka hona chahiye.';
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = 'Dono passwords match nahi kar rahe.';
        return;
      }

      button.disabled = true;
      message.textContent = 'Updating password...';

      try {
        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) throw error;

        message.textContent =
          'Password successfully updated! Ab Admin Login par jaakar naye password se login karo.';

        form.reset();
        await supabaseClient.auth.signOut();
      } catch (error) {
        message.textContent = 'Password update failed: ' + error.message;
      } finally {
        button.disabled = false;
      }
    });

    form.style.display = 'none';
    checkRecoverySession();
  </script>
</body>
</html>
